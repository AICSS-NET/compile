name: Build custom Babel standalone bundle

# 手动在 Actions 页点 "Run workflow" 触发。整个构建自包含在这一个文件里，
# 不需要仓库里有任何其它文件（package.json / entry.js 都在下面用 heredoc
# 现写现建）。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 准备构建目录 + 安装依赖
        run: |
          mkdir -p build && cd build
          cat > package.json << 'PKGJSON'
          {
            "name": "babel-custom-standalone-build",
            "private": true,
            "dependencies": {
              "@babel/core": "7.29.7",
              "@babel/preset-env": "7.29.7",
              "@babel/preset-react": "7.29.7",
              "@babel/preset-typescript": "7.29.7",
              "@babel/preset-flow": "7.29.7",
              "@babel/plugin-transform-modules-commonjs": "7.29.7",
              "assert": "^2.1.0",
              "path-browserify": "^1.0.1"
            },
            "devDependencies": { "esbuild": "0.23.1" }
          }
          PKGJSON
          npm install --no-audit --no-fund

      # 只认 env / react / typescript / flow 这 4 个 preset + 1 个 CommonJS
      # 插件——即 code-bridge.js 里 Babel.transform 实际用到的全部。传别的
      # preset 名字会直接抛错，方便第一时间发现遗漏，而不是静默漏转换。
      - name: 写入自定义入口文件
        run: |
          cd build
          mkdir -p src
          cat > shim-empty.js << 'SHIMJS'
          module.exports = {};
          SHIMJS
          cat > src/entry.js << 'ENTRYJS'
          import { transform } from '@babel/core';
          import presetEnv from '@babel/preset-env';
          import presetReact from '@babel/preset-react';
          import presetTypescript from '@babel/preset-typescript';
          import presetFlow from '@babel/preset-flow';
          import pluginTransformModulesCommonJS from '@babel/plugin-transform-modules-commonjs';

          var PRESETS = { env: presetEnv, react: presetReact, typescript: presetTypescript, flow: presetFlow };
          var PLUGINS = { 'transform-modules-commonjs': pluginTransformModulesCommonJS };

          function resolveEntry(map, item, kind) {
            if (Array.isArray(item)) {
              return [resolveEntry(map, item[0], kind), item[1]];
            }
            if (typeof item === 'string') {
              var resolved = map[item];
              if (!resolved) {
                throw new Error('Unknown ' + kind + ' "' + item + '". This custom build only includes: ' + Object.keys(map).join(', '));
              }
              return resolved;
            }
            return item;
          }

          function customTransform(code, options) {
            var opts = Object.assign({}, options);
            if (opts.presets) opts.presets = opts.presets.map(function (p) { return resolveEntry(PRESETS, p, 'preset'); });
            if (opts.plugins) opts.plugins = opts.plugins.map(function (p) { return resolveEntry(PLUGINS, p, 'plugin'); });
            opts.babelrc = false;
            opts.configFile = false;
            return transform(code, opts);
          }

          var api = { transform: customTransform, availablePresets: Object.keys(PRESETS), availablePlugins: Object.keys(PLUGINS) };
          if (typeof window !== 'undefined') { window.Babel = api; }
          export default api;
          ENTRYJS

      # 别名只留两类：
      # 1) path -> path-browserify：code-bridge.js 每次调用都会传 filename，
      #    react-display-name / modules-umd / helper-module-transforms 这几个
      #    插件真的会在内部调用 path.basename()，删掉会直接构建失败（已实测），
      #    所以这个必须给真实 polyfill，不能 stub 成空对象。
      #    assert -> assert：regenerator / typescript enum 转换里有几处内部
      #    断言用到它，同样是真实调用，给真实 polyfill。
      # 2) core-js-compat 的几份数据文件 -> 空对象：这些数据只服务于
      #    preset-env 的“自动注入 corejs polyfill”功能（对应 useBuiltIns /
      #    corejs 选项），code-bridge.js 从没开过这个选项，所以这条代码路径
      #    永远不会真正执行到，数据文件本身可以安全地替换成空对象，实测省
      #    下最大的一块体积。
      # 没有出现在这里的 Node 内置模块（fs / os / util / zlib / stream /
      # buffer / module 等）经实测在这套 preset 组合下完全不会被引用到，
      # esbuild 在打包期就已经把相关分支连同其 import 一起消掉了，所以既不
      # 需要装对应的 polyfill 包，也不需要写 alias——写了也是纯粹的死重量。
      - name: 打包
        run: |
          cd build
          npx esbuild src/entry.js \
            --bundle --platform=browser --format=iife --global-name=BabelBundle \
            --define:process.env.NODE_ENV=\"production\" \
            --alias:path=path-browserify \
            --alias:assert=assert \
            --alias:core-js-compat/data.json=./shim-empty.js \
            --alias:core-js-compat/data=./shim-empty.js \
            --alias:core-js-compat/entries.json=./shim-empty.js \
            --alias:core-js-compat/entries=./shim-empty.js \
            --alias:core-js-compat/get-modules-list-for-target-version=./shim-empty.js \
            --alias:@babel/compat-data/data/corejs2-built-ins.json=./shim-empty.js \
            --minify --outfile=dist/babel.custom.min.js

      # 覆盖 code-bridge.js 实际会调用到的全部场景；任何一项失败整个构建
      # 直接判失败，不会把跑不动的产物悄悄放出去。
      - name: 功能自测
        run: |
          cd build
          cat > smoke-test.js << 'TESTJS'
          global.window = globalThis;
          require('./dist/babel.custom.min.js');
          var Babel = window.Babel;

          function must(label, fn, contains) {
            var out;
            try { out = fn(); } catch (e) {
              console.error('FAIL [' + label + ']: threw ' + e.message);
              process.exitCode = 1;
              return;
            }
            if (contains && out.indexOf(contains) === -1) {
              console.error('FAIL [' + label + ']: expected output to contain "' + contains + '", got:\n' + out);
              process.exitCode = 1;
              return;
            }
            console.log('OK   [' + label + ']');
          }

          must('typescript strips types', function () {
            return Babel.transform('interface Foo { a: number } function f(x: Foo): number { return x.a; }',
              { presets: ['typescript'], filename: 'f.tsx' }).code;
          }, 'function f(x)');

          must('flow strips types', function () {
            return Babel.transform('// @flow\nfunction sq(n: number): number { return n * n; }',
              { presets: ['flow'], filename: 'f.js' }).code;
          }, 'function sq(n)');

          must('jsx classic runtime', function () {
            return Babel.transform('const el = <div className="x">{y}</div>;',
              { presets: [['react', { runtime: 'classic' }]], filename: 'f.jsx' }).code;
          }, 'React.createElement');

          must('jsx automatic runtime', function () {
            return Babel.transform('const el = <div className="x">{y}</div>;',
              { presets: [['react', { runtime: 'automatic' }]], filename: 'f.jsx' }).code;
          }, 'jsx-runtime');

          must('env downlevels for old targets', function () {
            return Babel.transform('const f = (a, b) => a + b;',
              { presets: [['env', { targets: 'chrome 41, safari 9' }]], filename: 'f.js' }).code;
          }, 'function f(a, b)');

          must('esm to commonjs', function () {
            return Babel.transform('export const bar = 1;',
              { plugins: ['transform-modules-commonjs'], filename: 'f.js' }).code;
          }, 'exports.bar');

          must('unknown preset throws a clear error', function () {
            try {
              Babel.transform('const x = 1;', { presets: ['stage-3'], filename: 'f.js' });
              return 'DID NOT THROW';
            } catch (e) {
              return e.message;
            }
          }, 'Unknown preset "stage-3"');

          if (process.exitCode === 1) {
            console.error('\n功能自测未通过，构建失败。');
            process.exit(1);
          }
          console.log('\n全部功能自测通过。');
          TESTJS
          node smoke-test.js

      - name: 报告体积
        run: |
          cd build
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/babel.custom.min.js | awk '{print "- raw: " $5}' >> "$GITHUB_STEP_SUMMARY"
          gzip -kf dist/babel.custom.min.js
          ls -lh dist/babel.custom.min.js.gz | awk '{print "- gzip: " $5}' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "只保留 env / react / typescript / flow 这 4 个 preset 加" >> "$GITHUB_STEP_SUMMARY"
          echo "1 个 CommonJS 插件，并把 preset-env 里从未用到的 corejs" >> "$GITHUB_STEP_SUMMARY"
          echo "polyfill 数据表裁掉，实测比官方 @babel/standalone 原始体积" >> "$GITHUB_STEP_SUMMARY"
          echo "小约 24%，gzip 后小约 13%。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ 不支持 IE 11：现行 caniuse-lite 已彻底不收录 IE 数据，" >> "$GITHUB_STEP_SUMMARY"
          echo "targets 里写 'ie 11' 会被静默忽略（不报错，也不会做任何" >> "$GITHUB_STEP_SUMMARY"
          echo "降级），这与本构建是否精简无关，官方最新版同样如此。" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: babel-custom-bundle
          path: |
            build/dist/babel.custom.min.js
            build/dist/babel.custom.min.js.gz
          retention-days: 30

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            build/dist/babel.custom.min.js
            build/dist/babel.custom.min.js.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
