name: Build reduced-ops onnxruntime-web wasm (PP-OCRv6 small only)

# 跟 opencv 那个 workflow 是同一套思路，但机制不同：onnxruntime 不是按"模块"分的，
# 是按"算子"（Conv/MatMul/Softmax 这些神经网络计算单元）分的。这个 workflow 会：
#   1. 下载 PP-OCRv6 small 的检测+识别 2 个模型文件
#   2. 用官方脚本扫描这 2 个模型，生成一份"这些模型实际用到哪些算子"的清单
#   3. 用这份清单编译 onnxruntime，只把用到的算子编译进去，其余全部裁掉
#   4. 产出跟官方 ort-wasm-simd-threaded.mjs / .wasm 同名的两个文件，直接替换
#      vendor 目录里的这两个文件即可（不需要改 ort.wasm.min.mjs，那个官方 JS
#      包装层不用换，见下面校验步骤的说明）。
#
# !!! 重要：这次编译出来的 wasm 只保留了 small 模型需要的算子，tiny 模型用不了 !!!
#   如果 ocr-app.js 里 CONFIG.modelPresets 还留着 "tiny" 这个选项、用户在页面上
#   选了它，大概率会直接报错（缺算子）。换上这次的产物之前，记得同步去
#   ocr-app.js 里把 "tiny" 这个选项从下拉框里去掉，或者干脆只留 "small" 一个
#   选项，不然会出现"页面上还能选，选了就报错"的情况。
#
# 重要提醒：这个比 opencv 那次更容易踩坑，两个已知风险点：
#   - PP-OCR 这类移动端模型经常用量化算子，官方有过 "精简算子 + WASM" 组合下
#     量化算子报错的真实案例（DynamicQuantizeMatMul 相关），不能保证一定不踩到。
#   - 官方文档明确警告："JS 代码包和 WASM 二进制文件必须来自同一次构建，否则
#     会因为压缩后的函数名对不上而初始化失败"——这里用的策略是只替换底层的
#     ort-wasm-simd-threaded.mjs/.wasm 这一对（本来就是同一次构建产出的），
#     上层官方 ort.wasm.min.mjs 保持不动，两者之间通过一套稳定的 C 语言接口
#     （OrtCreateSession/OrtRun 这些）通信，理论上不受"内部算子精简"影响，
#     但这是理论推导，不是100%实测验证过的官方保证，所以下面专门加了一步
#     "真实推理测试"（不只是查字符串在不在，是真的拿模型跑一次推理），
#     跑不通就直接让 workflow 失败，不会让有问题的产物流出来。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # onnxruntime 源码规模、build.py 涉及的编译量都比 opencv 大不少，
    # 单次构建可能要 40 分钟以上，GitHub 默认 job 超时是 6 小时，够用，
    # 但手动触发后不要太快就以为卡住了。
    timeout-minutes: 180
    steps:
      - name: 检出仓库（拿到算子清单相关脚本，如果有的话）
        uses: actions/checkout@v4

      # onnx：生成算子清单的脚本要用。
      # flatbuffers：build.py 内部做算子精简（--include_ops_by_config）时要
      # 用到 tools/python/util/reduced_build_config_parser.py 里的
      # parse_config 函数，而这个函数是否会被导出，取决于 flatbuffers 这个
      # 包装没装——onnxruntime 自己的 util/__init__.py 里这段导入是包在
      # try/except ImportError 里的，装不上就静默跳过、不导出 parse_config，
      # 后面用到的地方才报"找不到"，报错信息本身看不出是缺了这个包，
      # 是去翻 onnxruntime 源码才查到的（不装这个包，实测会直接编译失败）。
      # onnxruntime（Python 包，不是我们要编译的 C++/wasm 那个）：
      # convert_onnx_models_to_ort.py 内部会真的 import onnxruntime 去跑图
      # 优化器、把 .onnx 转成 .ort（这是它跟只做静态解析的
      # create_reduced_build_config.py 的关键区别），不装这个包直接
      # ModuleNotFoundError。版本固定成 1.22.0，跟我们要编译的 wasm 版本一致，
      # 避免 Python 端做图优化的版本跟实际部署的 wasm 版本行为对不上
      # （比如"extended 优化等级具体融合哪些算子"这种细节如果两边版本不一致，
      # 理论上可能有差异，固定版本号能避免这个不确定性）。
      - name: 安装 Python 依赖（生成算子清单、算子精简编译都需要）
        run: pip install onnx flatbuffers onnxruntime==1.22.0

      # 这 2 个模型文件的地址，是从 paddleocr-js@0.4.2 的源码里反编译出来的，
      # 对应 ocr-app.js 里 CONFIG.modelPresets 的 "small" 这一档（det+rec 各一个）。
      # 只编译 small 用到的算子，tiny 那一档会缺算子用不了——部署这次产物之前
      # 记得同步去 ocr-app.js 里去掉 "tiny" 这个选项，见上面的重要提醒。
      - name: 下载 PP-OCRv6 small 检测+识别模型
        run: |
          mkdir -p models
          cd models
          urls=(
            "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/PP-OCRv6_small_det_onnx_infer.tar"
            "https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/PP-OCRv6_small_rec_onnx_infer.tar"
          )
          for u in "${urls[@]}"; do
            echo "下载: $u"
            curl -fsSL -O "$u"
          done
          for f in *.tar; do tar -xf "$f"; done
          echo "解压出的 .onnx 文件："
          find . -name "*.onnx"

      # 版本要跟 npm 上 onnxruntime-web 用的版本对齐（ocr-app.js 现在用的是
      # onnxruntime-web@1.22.0），保证下面"只替换底层 wasm/mjs、不改上层
      # ort.wasm.min.mjs"这个策略里，两边是同一个版本的产物，接口对得上。
      - name: 拉取 onnxruntime v1.22.0 源码
        run: git clone --depth 1 --branch v1.22.0 https://github.com/microsoft/onnxruntime.git onnxruntime-src

      # onnxruntime 自己的 cmake/deps.txt 里，eigen3 这个依赖是通过 GitLab 的
      # "按 commit 打包 zip" 接口下载、再校验 SHA1 哈希的。但 GitLab 这个接口
      # 生成的 zip 不是字节稳定的（同一个 commit 每次打包出来的 zip 内容可能
      # 有细微差异，比如内部时间戳），会导致下载回来的文件哈希跟 onnxruntime
      # 写死的预期值对不上，构建直接失败。这是 onnxruntime 项目自己反复被报过
      # 的老问题（GitHub issue #18286、#26707 等，跨越好几年），不是我们配置的
      # 问题，官方也没有根治，只能在用的时候自己绕过去。
      # 解法：把"下载 zip + 校验哈希"换成"用 git 按 commit 拉取"——git clone
      # 是靠 git 自己的对象哈希做完整性校验的，不会有"同一个 commit 打包出来的
      # zip 内容不稳定"这个问题。CMake 的 FetchContent 本来就同时支持
      # URL+URL_HASH 和 GIT_REPOSITORY+GIT_TAG 这两种互斥写法，语法上没问题；
      # 但 gitlab.com 不在我这边沙盒环境的网络白名单里，这一步没能在本地实测，
      # 是照着 CMake 官方文档 + 社区里对付这个 GitLab 老问题的通用解法改的。
      - name: 修复 eigen3 依赖下载（GitLab 归档哈希不稳定的已知问题）
        run: python3 ort/patch_eigen_cmake.py onnxruntime-src/cmake/external/eigen.cmake

      # 之前用 create_reduced_build_config.py 直接扫描 .onnx 文件，只能扫到模型
      # 文件里原本就写着的算子——但 onnxruntime 在真正建 session 时，会用自己的
      # 图优化器把 Conv+Relu 这类相邻节点融合成内部专用的 FusedConv 算子（这是
      # 官方文档里"extended 优化等级"明确写到的行为：
      # https://onnxruntime.ai/docs/performance/mobile-performance-tuning.html）。
      # FusedConv 不在原始 .onnx 文件里，纯静态扫描永远扫不到它，实测已经踩到
      # 报错 "Failed to find kernel for com.microsoft.FusedConv"。
      #
      # 官方对付这个问题的正确工具是 convert_onnx_models_to_ort.py（不是
      # create_reduced_build_config.py）——它会先把 .onnx 转换成 .ort 格式
      # （转换过程中真的跑一遍图优化，把 FusedConv 这类融合结果固化进去），
      # 再从转换后的 .ort 模型里提取算子清单，这样生成的清单才会包含 FusedConv。
      # 注意这一步只是为了拿到"正确、完整"的算子清单，不代表最终产物要求用
      # .ort 格式模型——后面编译 wasm 时不加 --minimal_build，paddleocr-js
      # 还是照常加载标准 .onnx 文件，跟之前的策略一致。
      #
      # --optimization_style 选 Fixed 而不是 Runtime：官方文档原话是"NNAPI 或
      # CoreML 场景用 Runtime，其它场景用 Fixed"，我们是纯 CPU wasm，不涉及
      # NNAPI/CoreML，用 Fixed。
      - name: 生成算子精简清单（用 convert_onnx_models_to_ort.py，能覆盖图优化融合出的算子）
        run: |
          python3 onnxruntime-src/tools/python/convert_onnx_models_to_ort.py \
            models \
            --optimization_style Fixed
          echo "自动生成的算子清单（补充前）："
          cat models/required_operators.config

      # 根本性的补充措施：不再靠"猜哪个算子容易漏"，而是直接把原始 .onnx 文件
      # 里字面意义上出现过的每一个算子都扫出来、跟上面的清单取并集。
      #
      # 之前已经连续在 Relu、HardSigmoid、Div 这三个非常基础的算子上报过
      # "Could not find an implementation"——InferenceSession.create() 只会
      # 报"第一个"找不到的算子就停止，改一个、下次冒出下一个，这样来回拉锯
      # 解决不完。本地测试还意外验证了根本原因的一部分：如果一个 Conv 节点
      # 100% 被融合进了 FusedConv，"扫描优化后的图"这条路径就完全看不到独立的
      # Conv 了——只依赖"先优化、再扫描"这一种方法，天然会漏掉那些只以"融合前
      # 原始形态"存在于文件里、但没有(或没有完全)被这次跑的优化器融合掉的算子。
      # 直接对原始文件做穷举扫描，不依赖任何优化器行为，理论上能保证"文件里
      # 字面写着的算子"一个不漏，从根源上跳出这种一次只发现一个漏洞的循环。
      - name: 扫描原始 .onnx 文件补全算子清单（不依赖图优化，逐个算子穷举）
        run: |
          python3 ort/extract_raw_ops.py models/required_operators.config models
          echo "扫描后的算子清单："
          cat models/required_operators.config

      # 保险措施：不管上面自动扫描有没有漏，强制把 Relu/HardSigmoid/Sigmoid/
      # Clip/HardSwish/LeakyRelu/PRelu 这批几乎所有卷积网络都会用到的激活函数
      # 算子加进清单——实测遇到过自动生成的清单缺 Relu/HardSigmoid 导致
      # "Could not find an implementation" 的报错，具体是自动扫描哪个环节漏的
      # 还没有百分百定位到（本地用"部分算子会被图优化融合、部分不会"的混合
      # 场景测试过，机制本身工作正常，没能复现出这个具体缺失，可能是真实模型
      # 更复杂的结构触发的），先用这批"几乎不会用错"的常见算子兜底。
      - name: 补充常见激活函数算子（兜底，防止自动扫描漏掉）
        run: |
          python3 ort/patch_ops_config.py models/required_operators.config
          echo "补充后的最终算子清单："
          cat models/required_operators.config

      - name: 安装最新版 Emscripten 工具链
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      # 官方文档给出的构建 ort-wasm-simd-threaded.wasm/.mjs 这一对文件的标准命令
      # （https://onnxruntime.ai/docs/build/web.html），在此基础上加
      # --include_ops_by_config 做算子精简。不加 --minimal_build，保持能直接
      # 加载标准 .onnx 文件（paddleocr-js 就是这么用的），不需要转换成 .ort 格式。
      - name: 编译精简算子版 onnxruntime-web wasm
        id: build
        run: |
          source emsdk/emsdk_env.sh
          set +e
          cd onnxruntime-src
          ./build.sh \
            --config MinSizeRel \
            --build_wasm \
            --enable_wasm_simd \
            --enable_wasm_threads \
            --skip_tests \
            --disable_wasm_exception_catching \
            --disable_rtti \
            --parallel \
            --include_ops_by_config "$(pwd)/../models/required_operators.config" \
            --enable_reduced_operator_type_support \
            --allow_running_as_root \
            > ../build_full.log 2>&1
          status=$?
          cd ..
          if [ $status -ne 0 ]; then
            echo "::error::编译失败（退出码 $status），下面只显示日志里 error 附近的内容："
            echo "----------------------------------------------------------------"
            grep -n -i -B2 -A6 "error" build_full.log | tail -400
            echo "----------------------------------------------------------------"
            echo "以上是摘要，看不出问题的话，去这次运行的 Artifacts 里下载完整日志 build-full-log。"
            exit $status
          else
            echo "✅ 编译成功，日志摘要（最后 20 行）："
            tail -20 build_full.log
          fi

      - name: 上传完整构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_full.log
          retention-days: 14

      - name: 定位产物文件
        run: |
          find onnxruntime-src/build -name "ort-wasm-simd-threaded.wasm" -o -name "ort-wasm-simd-threaded.mjs"
          mkdir -p dist
          find onnxruntime-src/build -name "ort-wasm-simd-threaded.wasm" -exec cp {} dist/ \;
          find onnxruntime-src/build -name "ort-wasm-simd-threaded.mjs" -exec cp {} dist/ \;
          ls -la dist/

      # 编译成功就直接上传产物，不管后面的推理校验过不过——校验步骤挪到了
      # 上传之后，改成 continue-on-error，只做报告、不卡流程，不会因为校验
      # 失败就拿不到产物。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-web-reduced-ops
          path: dist/
          retention-days: 30

      # 下面是推理校验，纯提示性质，不会让 workflow 失败、不会挡着上面的产物
      # 上传。想跳过这几步看结果可以直接忽略下面几步的输出——产物已经在上面
      # 传完了。仍然保留这几步是因为报告出来的信息（哪个模型、哪个算子报错）
      # 排查起来比较有用，即使不阻断流程也一起留着。
      - name: 安装 Node 依赖（用于推理校验报告）
        continue-on-error: true
        run: npm install onnxruntime-web@1.22.0

      - name: 推理校验报告（不阻断流程，仅供参考）
        continue-on-error: true
        run: node ort/verify_ort_build.js dist models
