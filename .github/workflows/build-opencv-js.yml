name: Build OpenCV.js Minimal PaddleOCR


on:

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          cmake \
          python3 \
          python3-pip \
          build-essential



    - name: Install Emscripten

      shell: bash

      run: |

        git clone https://github.com/emscripten-core/emsdk.git

        cd emsdk

        ./emsdk install latest

        ./emsdk activate latest



    - name: Clone OpenCV 4.12.0

      shell: bash

      run: |

        git clone \
          --depth 1 \
          --branch 4.12.0 \
          https://github.com/opencv/opencv.git



    - name: Build OpenCV.js

      shell: bash

      run: |

        source emsdk/emsdk_env.sh


        python3 opencv/platforms/js/build_js.py \
          build_output \
          --build_wasm \
          --disable_single_file \
          --config "$(pwd)/opencv_js_minimal.config.py" \
          --cmake_option="-DBUILD_TESTS=OFF" \
          --cmake_option="-DBUILD_PERF_TESTS=OFF" \
          --cmake_option="-DBUILD_EXAMPLES=OFF"



    - name: Verify OpenCV.js

      shell: bash

      run: |

        node verify_opencv_build.js \
          build_output/bin/opencv.js



    - name: Prepare release

      shell: bash

      run: |

        mkdir release


        cp build_output/bin/opencv.js release/

        cp build_output/bin/opencv_js.wasm release/



    - name: Upload artifact

      uses: actions/upload-artifact@v4

      with:

        name: opencv-js-paddleocr-minimal

        path:

          release/
