name: Build slim webcrack

on:
  workflow_dispatch:
    inputs:
      webcrack_version:
        description: 'webcrack version (e.g. 2.16.0 or latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: |
          npm init -y
          npm install esbuild webcrack@${{ github.event.inputs.webcrack_version || 'latest' }} assert util path-browserify

      - name: Build
        run: node scripts/build-webcrack.mjs

      - name: Show size
        run: |
          ls -lh dist/webcrack.min.js
          gzip -c dist/webcrack.min.js | wc -c | awk '{printf "gzip: %.1f KB\n", $1/1024}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webcrack-slim
          path: dist/webcrack.min.js
          retention-days: 30
