name: Build pdf.js (原生 <script> 版，非 module)

# ============================================================================
# 背景（决定了这个 workflow 为什么长这样，实测于 v6.3.289）：
#
# pdf.js 从 4.x 开始，官方构建链（gulpfile.mjs）里所有产物——包括名字里带
# "legacy" 的那个任务——都被写死成 webpack 的 `library: { type: "module" }`，
# 也就是只产出 .mjs（ESM）。现在 `gulp generic-legacy` 里 "legacy" 的含义
# 已经变成"转译到更老的 JS 语法"，跟"是不是 ES Module"没关系了：产物依然是
# pdf.mjs / pdf.worker.mjs，用普通 <script> 加载会直接报
# `Uncaught SyntaxError: Cannot use 'import.meta' outside a module`。
# 官方已经不再提供真正的非 module（UMD/经典脚本）构建了。
#
# 所以这个 workflow 在构建前，会用 .github/scripts/patch-pdfjs-legacy.py
# 给 checkout 下来的 gulpfile.mjs 打两处小补丁（脚本里有详细注释）：
#   1. 主文件（pdf.js）的 webpack 输出从 ESM 改成 UMD，这样加载后会在全局
#      挂一个 window.pdfjsLib，用法和老版本 pdfjs-dist@3.x 完全一样。
#   2. 只在生成这个非 ESM 主文件时，才打开 webpack 对 import.meta.url 的
#      内置转换（源码里 Node 专用分支用到了它，ESM 产物里本来就合法，
#      不需要转换；非 ESM 产物里这行字面量是非法语法，必须让 webpack 转换掉）。
#
# 只改主文件，worker（pdf.worker.mjs）保持官方原生 ESM 不变：pdf.js 内部创建
# worker 用的是 `new Worker(workerSrc, { type: "module" })`（src/display/api.js），
# 这是 Worker 自己的加载方式，跟主线程那个 <script> 标签是不是 type="module"
# 完全无关，所以 worker 不需要跟着改，两者版本也天然保持一致，不用像
# CDN 拼接方案那样自己去对版本号。
#
# 这套补丁已经在 v6.3.289 上完整跑通验证：产出的 pdf.js 能通过
# `node --check`（合法经典脚本语法，不含 import.meta / 顶层 export），
# 在浏览器环境（用 jsdom 模拟真实 <script> 执行）里
# window.pdfjsLib.getDocument / window.pdfjsLib.GlobalWorkerOptions 都能正常拿到。
# 如果以后 pdf.js 上游重构了这部分 gulpfile.mjs、补丁脚本的锚点文本对不上，
# 补丁步骤会直接报错让整个 job 失败（不会静默生成一个没打上补丁的坏文件），
# 按报错提示更新 patch-pdfjs-legacy.py 里的锚点即可。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      pdfjs_version:
        description: '要构建的 pdf.js 版本号（对应仓库 tag，不带 v 前缀，如 6.3.289）'
        required: true
        default: '6.3.289'
      commit_to_repo:
        description: '是否把构建产物直接提交回本仓库'
        required: false
        default: 'false'
        type: boolean
      dest_dir:
        description: '提交回仓库时，产物存放的目录'
        required: false
        default: 'bak/js/tool'

# 所有硬编码的路径/常量集中放在这里，方便以后调整
env:
  PDFJS_REPO: mozilla/pdf.js
  PDFJS_SRC_DIR: pdfjs-src
  NODE_VERSION: '20'
  LEGACY_BUILD_DIR: pdfjs-src/build/generic-legacy/build
  PATCH_SCRIPT: .github/scripts/patch-pdfjs-legacy.py

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout 当前仓库自己：需要用到里面的补丁脚本，提交产物时也要用到
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      # 单独把 pdf.js 官方源码 checkout 到子目录，锁定到指定 tag，
      # 保证每次构建版本可控、可重现
      - name: Checkout pdf.js 源码 (v${{ github.event.inputs.pdfjs_version }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PDFJS_REPO }}
          ref: v${{ github.event.inputs.pdfjs_version }}
          path: ${{ env.PDFJS_SRC_DIR }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PDFJS_SRC_DIR }}/package-lock.json

      # gulp generic-legacy 只是打包浏览器脚本，用不到 canvas 原生编译；
      # 但 npm ci 会按 package.json 把所有 devDependencies 一起装上，
      # 其中可能包含需要系统库才能编译成功的原生依赖，这里预先装好常见的几个，
      # 避免在没有这些库的 runner 上 npm ci 直接失败。
      - name: 安装系统依赖（供原生模块编译用）
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: 安装 pdf.js 依赖
        working-directory: ${{ env.PDFJS_SRC_DIR }}
        run: npm ci

      - name: 打补丁：主文件改成非 module（UMD）输出
        run: python3 "${{ env.PATCH_SCRIPT }}" "${{ env.PDFJS_SRC_DIR }}/gulpfile.mjs"

      # 生成产物：主文件是打了补丁的非 module 版本（pdf.js），
      # worker（pdf.worker.mjs）保持官方原生 ESM
      - name: 构建 generic-legacy
        working-directory: ${{ env.PDFJS_SRC_DIR }}
        run: npx gulp generic-legacy

      - name: 校验构建产物
        working-directory: ${{ env.PDFJS_SRC_DIR }}
        run: |
          set -e
          ls -la build/generic-legacy/build

          test -f build/generic-legacy/build/pdf.js
          test -f build/generic-legacy/build/pdf.worker.mjs

          # 用 Node 自带的语法检查确认主文件是合法的"经典脚本"
          # （如果补丁没生效，这里会因为里面还有 import.meta/export 而直接报语法错误）
          node --check build/generic-legacy/build/pdf.js

          if grep -q "import\.meta" build/generic-legacy/build/pdf.js; then
            echo "::error::pdf.js 里还残留 import.meta，补丁没有完全生效"
            exit 1
          fi
          if grep -qE "^export " build/generic-legacy/build/pdf.js; then
            echo "::error::pdf.js 里还有顶层 export，补丁没有完全生效"
            exit 1
          fi

          echo "校验通过：pdf.js 是合法的非 module 经典脚本"

      # 打成 Artifact，方便不需要自动提交时手动下载
      - name: 上传构建产物为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfjs-legacy-${{ github.event.inputs.pdfjs_version }}
          path: |
            ${{ env.LEGACY_BUILD_DIR }}/pdf.js
            ${{ env.LEGACY_BUILD_DIR }}/pdf.js.map
            ${{ env.LEGACY_BUILD_DIR }}/pdf.worker.mjs
            ${{ env.LEGACY_BUILD_DIR }}/pdf.worker.mjs.map
          if-no-files-found: error

      # 可选：直接把产物提交回当前仓库指定目录，省去手动下载/上传这一步。
      # worker 文件特意从 .mjs 重命名成 .js：内容还是原生 ESM，
      # pdf.js 内部一直是用 `new Worker(url, {type:'module'})` 加载它的，
      # 跟文件扩展名无关；改成 .js 只是为了迁就一些老式静态文件服务器——
      # 它们通常认识 .js 该配什么 Content-Type（text/javascript），
      # 但不一定认识 .mjs，容易配成 application/octet-stream 之类导致浏览器拒绝执行。
      # 如果你确定自己的服务器/CDN 对 .mjs 也能返回正确的 JS MIME 类型，
      # 也可以把下面这行改成保留 .mjs 后缀。
      - name: 复制产物到目标目录
        if: ${{ github.event.inputs.commit_to_repo == 'true' }}
        run: |
          mkdir -p "${{ github.event.inputs.dest_dir }}"
          cp "${{ env.LEGACY_BUILD_DIR }}/pdf.js" "${{ github.event.inputs.dest_dir }}/pdfjs.js"
          cp "${{ env.LEGACY_BUILD_DIR }}/pdf.worker.mjs" "${{ github.event.inputs.dest_dir }}/pdfjs.worker.js"

      - name: 提交变更
        if: ${{ github.event.inputs.commit_to_repo == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 更新 pdf.js 到 v${{ github.event.inputs.pdfjs_version }}（非 module 经典脚本版）"
          file_pattern: ${{ github.event.inputs.dest_dir }}/pdfjs.js ${{ github.event.inputs.dest_dir }}/pdfjs.worker.js
