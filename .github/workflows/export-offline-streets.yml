name: Export offline streets (Fixed 20 Countries)

on:
  workflow_dispatch:

concurrency:
  group: export-offline-streets
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  ADDRESS_DATABASE_PATH: data/address.sqlite
  # 精选的 20 个代表性国家。这是整个 workflow 里唯一的国家列表来源，
  # "策略覆盖"步骤和"国家循环"步骤都从这里读取，避免两处列表不同步——
  # 不同步会导致漏掉策略覆盖的国家悄悄退回仓库内置的巨大默认采集目标，
  # 又变回之前的慢速行为，且不会有任何报错提示。
  COUNTRIES: 'US CA MX GB DE FR IT ES NL RU JP KR SG VN TH PH MY IN AU BR'
  # 每个国家最终只需要 300 条（见 export-offline-streets.mjs 里的 FIXED_LIMIT）。
  # 这里给 3 倍缓冲（900），用来覆盖数据库 sync_country_policies 表里的
  # target_count —— 这才是真正控制 materialize 阶段要采集/排序/落盘多少行数据的开关。
  # 详见 scripts/set-country-policies.mjs 顶部注释。
  ADDRESS_SYNC_POLICY_TARGET_COUNT: '900'
  # 按国家单独覆盖 target_count（JSON）。
  # overture-export.py 里的建筑物空间匹配只在全国最密集的 24 个地理网格内进行，
  # 网格外的候选一律无法通过质量门。这对国土面积大、地址点分布分散的国家影响明显更大：
  # 实测 US 在 target_count=900 时最终只有 119 条通过（约 13% 转化率），
  # 远不够导出脚本需要的 300 条，所以先按同样的转化率倒推给它更大的候选池。
  # 后续如果发现 RU / AU / BR / IN 等同类国家也有同样的问题，照这个格式继续加进来即可。
  ADDRESS_SYNC_POLICY_TARGET_OVERRIDES: '{"US":4500}'

jobs:
  collect-all:
    name: Sync & Extract Top 20 Countries
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout self
        uses: actions/checkout@v4
        with:
          path: self

      - name: Checkout daimon3332/address
        uses: actions/checkout@v4
        with:
          repository: daimon3332/address
          ref: main
          path: address

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: address/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Global Setup & Install dependencies
        working-directory: address
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils build-essential cmake libexpat1-dev zlib1g-dev libbz2-dev

          npm ci

          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r server/sync/requirements.txt

          cp .env.example .env

          {
            echo "ADDRESS_DATABASE_PATH=${ADDRESS_DATABASE_PATH}"
            echo "ADDRESS_DATA_ROOT=data"
            echo "ADDRESS_SYNC_CACHE_DIR=data/staging"
            # 必须是 true：server/sync/sqlite-address-importer.mjs 里有一条硬性质量门，
            # 要求每条记录的 property_type 必须是 residential/apartment，且带有
            # residentialSourceRecordId，而这个字段只有在 Overture 建筑物数据参与空间
            # 匹配（ST_Intersects）之后才会被打上。一旦这里是 false，
            # server/sync/overture-export.py 收到的建筑物资产列表永远是空数组，
            # 只能走它的 fallback_query，里面把 property_type 写死成 'unknown'，
            # 导致 100% 的候选记录都会被判定为 missing_residential_evidence 而拒绝——
            # 不管等多久、候选数据抽多少条，这个国家永远是 0 条通过。这不是性能开关，
            # 是决定这条流水线有没有输出的开关。
            echo "ADDRESS_SYNC_OVERTURE_BUILDINGS=true"
            echo "ADDRESS_SYNC_REQUIRE_RESIDENTIAL=false"
            echo "ADDRESS_SYNC_TRANSLATION_ENABLED=false"
            echo "GOOGLE_TRANSLATION_ENABLED=false"
            # 注意：这个变量只是"兜底值"——只有当某个国家在
            # server/sync/address-policy.mjs 的 ADDRESS_POLICY_DEFAULTS 里完全没有
            # 内置策略时才会用到它。我们跑的这 20 个国家全部都有内置策略，真正生效的
            # 采集上限来自数据库 sync_country_policies 表，由下面新增的
            # "Cap country policy targets" 步骤写入（见顶层 env 的
            # ADDRESS_SYNC_POLICY_TARGET_COUNT）。保留这一行只是为了防御性兜底
            # （例如以后新增一个在 ADDRESS_POLICY_DEFAULTS 里没有内置策略的国家）。
            echo "ADDRESS_SYNC_MAX_RECORDS_PER_SHARD=5000"
          } >> .env

          mkdir -p data data/staging offline-addresses scripts
          npm run db:migrate

          npm run data:catalog || true
          if [ -f .data-cache/catalog-seed.sql ]; then
            npm run data:catalog:import
          fi

          cp ../self/scripts/export-offline-streets.mjs scripts/export-offline-streets.mjs
          cp ../self/scripts/set-country-policies.mjs scripts/set-country-policies.mjs

      - name: Cap country policy targets (real fix for slow materialize)
        working-directory: address
        run: |
          set -euo pipefail
          echo "🔧 把 sync_country_policies.target_count 从仓库内置的默认值"
          echo "   (US=50000 / JP=40000 / SG=8000 ...) 下调到 ${ADDRESS_SYNC_POLICY_TARGET_COUNT}"
          echo "   这才是 materialize 阶段真正要采集/排序/落盘多少行数据的开关，"
          echo "   之前 .env 里调低 ADDRESS_SYNC_MAX_RECORDS_PER_SHARD 对这 20 个国家从未生效过。"
          node scripts/set-country-policies.mjs

      - name: Restore Overture materialize cache
        uses: actions/cache/restore@v4
        with:
          path: address/data/staging/normalized
          key: overture-materialize-cache-${{ github.run_id }}
          restore-keys: |
            overture-materialize-cache-

      - name: Process 20 Fixed Countries Loop
        working-directory: address
        env:
          PYTHON_BIN: ${{ github.workspace }}/address/.venv/bin/python
        run: |
          set -euo pipefail

          echo "🚀 开始自动处理全球 20 个精选国家: $COUNTRIES"

          for CC in $COUNTRIES; do
            echo "::group::======== [ Processing $CC ] ========"

            echo "📥 开始同步 $CC ..."
            node --env-file-if-exists=.env server/sync/address-etl.mjs --manual --shard "$CC" || echo "⚠️ ETL 同步失败: $CC"

            echo "📤 开始进行 $CC 的水桶轮询抽取 (强行固定300条)..."
            node scripts/export-offline-streets.mjs \
              --db "${ADDRESS_DATABASE_PATH}" \
              --out offline-addresses \
              --country "$CC" || echo "⚠️ 数据抽取失败: $CC"

            # 只清理 DuckDB 自己的落盘临时目录 (spill temp)，不再整体删除 data/staging/*：
            # data/staging/normalized/*.jsonl 是 materialize 步骤的产出缓存
            # （materializeOverture 内置了"文件已存在就直接复用"的命中逻辑），删掉它，
            # 下次哪怕只是重新手动跑一次这个 workflow，也要重新对着远程 Overture
            # Parquet 扫描一遍。缓存文件本身很小（调低 target_count 后只有几百 KB
            # 级别），不清理不会把 runner 磁盘写满。
            rm -rf data/staging/normalized/duckdb-temp
            echo "::endgroup::"
          done

      - name: Save Overture materialize cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: address/data/staging/normalized
          key: overture-materialize-cache-${{ github.run_id }}

      - name: Upload Final Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-addresses
          path: address/offline-addresses/
          if-no-files-found: warn
          retention-days: 30
