name: Export offline streets (GeoNames + Overpass)

on:
  workflow_dispatch:
    inputs:
      countries:
        description: '国家代码列表,逗号分隔(留空则用默认的20个国家)'
        required: false
        default: ''
      cities_per_country:
        description: '每个国家采集人口最多的几个城市'
        required: false
        default: '6'
      limit_per_country:
        description: '每个国家最终导出的街道条数上限'
        required: false
        default: '120'
      user_agent:
        description: >-
          Overpass 请求用的 User-Agent(留空则用仓库变量 OVERPASS_USER_AGENT)。
          建议不要每次手填，去 Settings -> Secrets and variables -> Actions ->
          Variables 里加一个 OVERPASS_USER_AGENT，配一次就不用管了。
        required: false
        default: ''

concurrency:
  group: export-offline-streets
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  collect:
    name: Collect streets via GeoNames + Overpass
    runs-on: ubuntu-latest
    # 20 个国家 × 6 个城市 = 120 次 Overpass 查询，配合限速 + 失败重试 + 缩小半径兜底，
    # 墨西哥城/纽约这类超大都会偶尔会比较磨人，留够余量避免被 GitHub Actions 自己的
    # job 超时机制打断（打断后会看到 "Error: The operation was canceled." ——
    # 这条消息是 GitHub Actions 自己打的，不是脚本抛出的）。
    timeout-minutes: 180
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Collect streets
        env:
          OVERPASS_USER_AGENT: ${{ inputs.user_agent || vars.OVERPASS_USER_AGENT }}
        run: |
          set -euo pipefail

          if [ -z "${OVERPASS_USER_AGENT}" ]; then
            echo "❌ 没有配置 User-Agent。去 Settings -> Secrets and variables -> Actions ->"
            echo "   Variables 加一个仓库变量 OVERPASS_USER_AGENT，或者本次运行时在"
            echo "   workflow_dispatch 的 user_agent 输入框里临时填一个。"
            exit 1
          fi

          mkdir -p offline-addresses

          ARGS="--out offline-addresses"
          if [ -n "${{ inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ inputs.countries }}"
          fi
          ARGS="$ARGS --cities-per-country ${{ inputs.cities_per_country }}"
          ARGS="$ARGS --limit ${{ inputs.limit_per_country }}"

          echo "🚀 node scripts/collect-streets-overpass.mjs $ARGS"
          node scripts/collect-streets-overpass.mjs $ARGS

      - name: Upload Final Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-addresses
          path: offline-addresses/
          if-no-files-found: warn
          retention-days: 30
